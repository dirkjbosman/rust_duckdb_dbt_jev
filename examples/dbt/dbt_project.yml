name: kleinanzeigen
version: '1.0.0'
profile: kleinanzeigen

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Load the JEV extension before any model runs.
# Adjust the path if your working directory differs.
on-run-start:
  - "LOAD '{{ env_var('JEV_EXTENSION_PATH', '../../jev.duckdb_extension') }}';"

models:
  kleinanzeigen:
    staging:
      +materialized: view
    marts:
      +materialized: table
